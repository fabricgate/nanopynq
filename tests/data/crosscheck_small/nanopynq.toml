# A small design for the crosscheck tests (tests/test_crosscheck.py, test_build_design.py).
name = "small"
board = "tangnano9k"
sources = ["nanopynq:uart_rx.v", "nanopynq:uart_tx.v", "nanopynq:uartbone_bridge.v", "top.v"]
constraints = "small.cst"

[check]
depth = 20  # the 4-clock reset + three bus cycles need 14

[ips.sys]
base = "0x0"
type = "nanopynq:sysinfo:1.0"
registers.id = { offset = "0x0", width = 32, access = "ro" }
registers.version = { offset = "0x4", width = 32, access = "ro" }

[ips.toy]
base = "0x1000"
type = "test:toy:1.0"
registers.data = { offset = "0x0", width = 4, access = "rw" }
registers.status = { offset = "0x4", width = 2, access = "ro" }
registers.spare = { offset = "0x8", width = 32, access = "rw" }
registers.mode = { offset = "0xc", width = 8, access = "rw" }
