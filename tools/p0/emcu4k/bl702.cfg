# Tang Nano 4K debugger (BL702, FT2232 emulation): the layout openFPGALoader uses for its "ft2232" cable
# (interface A, ADBUS value 0x08 / direction 0x0B: TCK, TDI, TMS out; nothing on ADBUS4-6).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
transport select jtag
adapter speed 1000
