# Build with: nanopynq build examples/tangnano9k_adder  ->  dist/adder.fs, dist/adder.npq, dist/build.json
name = "adder"
board = "tangnano9k"
top = "top"
# Read in this order; the order and the set of files change the bitstream. nanopynq:<file> is nanopynq's shared RTL.
sources = [
    "adder.v",
    "nanopynq:base_regs.v",
    "nanopynq:regbus_gpio.v",
    "nanopynq:sysinfo.v",
    "nanopynq:uart_rx.v",
    "nanopynq:uart_tx.v",
    "nanopynq:uartbone_bridge.v",
    "top.v",
]
constraints = "tangnano9k.cst"

# sys, leds and buttons are collected from base_regs. adder is the example's own RTL, so nanopynq has no description
# of it: the IP is written whole here (spec 5.3).
[ips.adder]
base = "0x7000"
type = "fabricgate:adder:1.0"
addr_range = "0x10"
registers.a = { offset = "0x0", width = 32, access = "rw" }
registers.b = { offset = "0x4", width = 32, access = "rw" }
registers.sum = { offset = "0x8", width = 32, access = "ro" }
registers.carry = { offset = "0xc", width = 1, access = "ro" }
