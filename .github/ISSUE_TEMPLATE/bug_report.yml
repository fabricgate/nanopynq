name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: do not file them here, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste the full error.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest code or commands that show it.
      render: python
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board
      description: e.g. Tang Nano 9K, Tang Nano 20K, Tang Nano 4K, Tang Mega 138K Pro, or none.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The output of `python -m nanopynq doctor`, plus your OS and the nanopynq version (`pip show nanopynq`).
      render: text
    validations:
      required: true
