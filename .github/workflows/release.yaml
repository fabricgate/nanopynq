name: Release

# Triggers:
#   - push of a vX.Y.Z tag: release (CI, then PyPI with build provenance, then a GitHub Release)
#   - workflow_dispatch: TestPyPI dry-run (no GitHub Release)
#
# One-time setup by the owner:
#   - PyPI and TestPyPI: a Trusted Publisher for this repository (workflow release.yaml, environments pypi /
#     testpypi). Before the first release, a "pending" publisher, which also reserves the name.
#   - GitHub environments `pypi` and `testpypi` (Settings -> Environments).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: # TestPyPI dry-run

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check that the tag is the package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION != pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Use a unique dev version for TestPyPI dry-runs
        # TestPyPI never lets a file name be reused, so every dry-run publishes <version>.dev<run number>.
        if: github.event_name == 'workflow_dispatch'
        run: |
          BASE=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          uv version --frozen "${BASE}.dev${GITHUB_RUN_NUMBER}"

      - run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to ${{ github.event_name == 'workflow_dispatch' && 'TestPyPI' || 'PyPI' }}
    runs-on: ubuntu-latest
    needs: [build]
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write # Trusted Publishing (OIDC)
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # A dry-run may be repeated; a real release must fail on a version that already exists.
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}

  release:
    name: GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*
